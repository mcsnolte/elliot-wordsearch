<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#ffffff"/>
  
  <!-- Grid lines -->
  <g stroke="#cccccc" stroke-width="1">
    <!-- Vertical lines -->
    <line x1="8" y1="4" x2="8" y2="28"/>
    <line x1="16" y1="4" x2="16" y2="28"/>
    <line x1="24" y1="4" x2="24" y2="28"/>
    <!-- Horizontal lines -->
    <line x1="4" y1="8" x2="28" y2="8"/>
    <line x1="4" y1="16" x2="28" y2="16"/>
    <line x1="4" y1="24" x2="28" y2="24"/>
  </g>

  <!-- Letters -->
  <g fill="#333333" font-family="Arial" font-size="7" text-anchor="middle">
    <text x="12" y="13">W</text>
    <text x="20" y="13">O</text>
    <text x="12" y="21">R</text>
    <text x="20" y="21">D</text>
  </g>

  <!-- Highlight rectangle -->
  <rect x="10" y="6" width="16" height="8" fill="#a5d8ff" opacity="0.5" rx="2"/>

  <!-- Border -->
  <rect width="32" height="32" rx="4" fill="none" stroke="#666666" stroke-width="1"/>
</svg> 